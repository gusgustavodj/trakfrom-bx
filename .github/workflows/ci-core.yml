{
  "name": "Core portability signal",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "SOURCE_DATE_EPOCH": "1791504000",
    "PYTHONDONTWRITEBYTECODE": "1"
  },
  "jobs": {
    "core-portability": {
      "name": "macOS core signal / Python ${{ matrix.python }}",
      "runs-on": "macos-latest",
      "timeout-minutes": 15,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.11",
            "3.13"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v7",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Install build and test tools",
          "run": "python -m pip install build==1.6.1 setuptools==83.0.0 wheel==0.47.0 pytest==9.1.1"
        },
        {
          "name": "Positive public inventory, private dependencies and secrets",
          "run": "python scripts/check_public_tree.py"
        },
        {
          "name": "Clean package installation",
          "run": "python -m pip install --no-deps ."
        },
        {
          "name": "Portable installed imports",
          "run": "python scripts/smoke_imports.py --core --installed"
        },
        {
          "name": "Portable software contracts only",
          "run": "python scripts/run_public_tests.py --core --installed"
        }
      ]
    }
  }
}
