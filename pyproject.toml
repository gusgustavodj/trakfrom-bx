[project]
name = "trakfrom-bx"
version = "0.1.0.dev0"
description = "Read-only bridge for projecting supported Rekordbox USB libraries into a Traktor-compatible workflow."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]
dependencies = []

[project.scripts]
trakfrom-bx = "rekordbox_usb.public_cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
build-backend = "build_backend"
backend-path = ["scripts"]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["rekordbox_usb", "rekordbox_usb.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["core_portable: explicit portable software contract", "windows_only: Windows contract or native identity boundary"]

[tool.ruff]
target-version = "py311"
line-length = 100
